<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>20/100分表 - 雲端團隊版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- 引入 Google Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore-compat.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
    input[type=number] {
      -moz-appearance: textfield;
    }

    /* 螢幕端樣式 */
    @media screen {
      .sheet-border { border: 2px solid #333333; }
      .sheet-border th, .sheet-border td { border: 1px solid #4B5563; }
      .sheet-border-outer { border: 2px solid #333333; }
    }

    /* 列印專用樣式（鎖定標準 A4 單頁比例） */
    @media print {
      @page {
        size: A4 portrait;
        margin: 8mm 10mm;
      }
      *, *::before, *::after {
        box-shadow: none !important;
        text-shadow: none !important;
      }
      html, body {
        width: 100% !important;
        height: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #ffffff !important;
        overflow: hidden !important;
      }
      .no-print {
        display: none !important;
      }
      .desktop-table-container {
        display: block !important;
      }
      .mobile-card-container {
        display: none !important;
      }
      #print-area {
        width: 185mm !important;
        max-width: 185mm !important;
        margin: 0 auto !important;
        padding: 0 !important;
        transform: scale(0.96);
        transform-origin: top center;
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }
      .sheet-border, .sheet-border-outer {
        border: 1.5px solid #000000 !important;
      }
      .sheet-border th, .sheet-border td {
        border: 1px solid #000000 !important;
        padding: 1px 2px !important;
      }
      input, textarea {
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
        color: #000000 !important;
      }
      .print-row-h {
        height: 22px !important;
      }
      .print-line-row {
        height: 20px !important;
        border-bottom: 1px solid #666666 !important;
      }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 antialiased pb-12">

  <!-- 頂部控制面板 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm no-print">
    <div class="max-w-5xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      
      <!-- 成員選擇與狀態 -->
      <div class="flex items-center gap-3">
        <div class="flex items-center gap-2">
          <label class="text-xs font-bold text-slate-500 uppercase tracking-wider">成員姓名/代號</label>
          <input type="text" id="member-id-input" placeholder="例如: 承樺" class="px-2.5 py-1 text-sm font-semibold border border-slate-300 rounded focus:ring-2 focus:ring-blue-500 focus:outline-none w-28 md:w-36">
          <button id="btn-switch-member" class="px-2.5 py-1 text-xs bg-slate-800 hover:bg-slate-900 text-white font-medium rounded transition">載入</button>
        </div>

        <div class="hidden sm:flex items-center gap-1.5 px-2 py-0.5 rounded-full text-xs font-medium" id="sync-badge">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="sync-status" class="text-slate-600">雲端就緒</span>
        </div>
      </div>

      <!-- 右側按鈕組 -->
      <div class="flex items-center gap-2">
        <!-- 手機模式切換 -->
        <button id="btn-toggle-view" class="md:hidden flex items-center gap-1 px-2.5 py-1 text-xs font-semibold rounded border border-blue-200 bg-blue-50 text-blue-700">
          <span id="toggle-view-text">📊 全週大表</span>
        </button>

        <button id="btn-print" class="flex items-center gap-1 px-3 py-1.5 text-xs font-semibold rounded bg-indigo-600 hover:bg-indigo-700 text-white shadow-sm transition">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
          列印 A4
        </button>

        <button id="btn-clear" class="flex items-center gap-1 px-2.5 py-1.5 text-xs font-semibold rounded border border-red-200 text-red-600 hover:bg-red-50 transition">
          一鍵清零
        </button>
      </div>
    </div>
  </header>

  <!-- 主體報表容器 -->
  <main class="max-w-4xl mx-auto mt-4 px-2 sm:px-4">
    <div id="print-area" class="bg-white p-4 sm:p-6 rounded-xl shadow-md border border-slate-200">
      
      <!-- 表頭標題 -->
      <div class="text-center relative mb-4">
        <h1 class="text-2xl sm:text-3xl font-extrabold tracking-widest text-slate-900">20 / 100 分 表</h1>
        <div class="absolute right-0 top-1 text-xs text-slate-500 font-mono" id="current-week-label">
          週次: <span id="week-display" class="font-bold text-slate-700"></span>
        </div>
      </div>

      <!-- 手機專屬：每日卡片導航（電腦端自動隱藏） -->
      <div class="mobile-card-container md:hidden mb-4 no-print" id="mobile-focus-section">
        <div class="flex overflow-x-auto gap-1 pb-2 border-b border-slate-200" id="day-tabs">
          <!-- JS 動態生成週一至週日 Tabs -->
        </div>
        <div id="day-cards-wrapper" class="pt-3 space-y-2.5">
          <!-- JS 動態生成當日的 6 大項目卡片 -->
        </div>
      </div>

      <!-- 電腦端 / 列印全週矩陣大表 -->
      <div class="desktop-table-container overflow-x-auto" id="desktop-table-wrapper">
        <table class="w-full sheet-border border-collapse text-xs md:text-sm text-center table-fixed">
          <colgroup>
            <col class="w-[25%]">
            <col class="w-[5%]">
            <col class="w-[5%]"><col class="w-[5%]">
            <col class="w-[5%]"><col class="w-[5%]">
            <col class="w-[5%]"><col class="w-[5%]">
            <col class="w-[5%]"><col class="w-[5%]">
            <col class="w-[5%]"><col class="w-[5%]">
            <col class="w-[5%]"><col class="w-[5%]">
            <col class="w-[5%]"><col class="w-[5%]">
            <col class="w-[10%]">
          </colgroup>
          <thead>
            <tr class="bg-slate-50 print-row-h font-bold">
              <th rowspan="2" class="p-1 border border-slate-700">
                <div class="flex items-center justify-center gap-1">
                  <input type="text" id="date-start" class="w-12 text-center bg-transparent border-b border-slate-300 focus:outline-none focus:border-blue-500" placeholder="MM/DD">
                  <span>~</span>
                  <input type="text" id="date-end" class="w-12 text-center bg-transparent border-b border-slate-300 focus:outline-none focus:border-blue-500" placeholder="MM/DD">
                </div>
                <div class="text-[11px] text-slate-500 font-normal mt-0.5">工作量統計</div>
              </th>
              <th rowspan="2" class="p-1 border border-slate-700 leading-tight">分數</th>
              <th colspan="2" class="border border-slate-700 py-0.5">星期一</th>
              <th colspan="2" class="border border-slate-700 py-0.5">星期二</th>
              <th colspan="2" class="border border-slate-700 py-0.5">星期三</th>
              <th colspan="2" class="border border-slate-700 py-0.5">星期四</th>
              <th colspan="2" class="border border-slate-700 py-0.5">星期五</th>
              <th colspan="2" class="border border-slate-700 py-0.5">星期六</th>
              <th colspan="2" class="border border-slate-700 py-0.5">星期日</th>
              <th rowspan="2" class="p-1 border border-slate-700 leading-tight">總分</th>
            </tr>
            <tr class="bg-slate-50 text-[11px] font-bold border-b border-slate-700">
              <th>T</th><th>P</th>
              <th>T</th><th>P</th>
              <th>T</th><th>P</th>
              <th>T</th><th>P</th>
              <th>T</th><th>P</th>
              <th>T</th><th>P</th>
              <th>T</th><th>P</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- JS 動態生成 6 列工作項目 -->
          </tbody>
          <tfoot>
            <tr class="bg-slate-100 font-bold border-t-2 border-slate-700 print-row-h">
              <td colspan="2" class="py-1">總分</td>
              <!-- 各日 P 總計 -->
              <td colspan="2" class="text-blue-700" id="col-p-sum-0">0</td>
              <td colspan="2" class="text-blue-700" id="col-p-sum-1">0</td>
              <td colspan="2" class="text-blue-700" id="col-p-sum-2">0</td>
              <td colspan="2" class="text-blue-700" id="col-p-sum-3">0</td>
              <td colspan="2" class="text-blue-700" id="col-p-sum-4">0</td>
              <td colspan="2" class="text-blue-700" id="col-p-sum-5">0</td>
              <td colspan="2" class="text-blue-700" id="col-p-sum-6">0</td>
              <td id="grand-total" class="text-base text-red-600 font-extrabold bg-red-50">0</td>
            </tr>
          </tfoot>
        </table>
      </div>

      <!-- 週成果統計 -->
      <div class="mt-4 border border-slate-700 rounded-sm overflow-hidden text-xs md:text-sm">
        <div class="bg-slate-50 border-b border-slate-700 text-center py-1 font-bold tracking-wider">週 成 果 統 計</div>
        <div class="grid grid-cols-3 divide-x divide-slate-700 text-center border-b border-slate-700">
          <div class="p-1.5 flex items-center justify-center gap-1">
            <span>新增新名單</span>
            <input type="text" id="stat-leads" class="w-12 text-center font-bold text-blue-800 border-b border-slate-400 focus:outline-none" placeholder="0">
            <span>位</span>
          </div>
          <div class="p-1.5 flex items-center justify-center gap-1">
            <span>建議書</span>
            <input type="text" id="stat-proposals" class="w-12 text-center font-bold text-blue-800 border-b border-slate-400 focus:outline-none" placeholder="0">
            <span>份</span>
          </div>
          <div class="p-1.5 flex items-center justify-center gap-1">
            <span>簽約量</span>
            <input type="text" id="stat-closes" class="w-12 text-center font-bold text-blue-800 border-b border-slate-400 focus:outline-none" placeholder="0">
            <span>份</span>
          </div>
        </div>
        <div class="grid grid-cols-3 divide-x divide-slate-700 text-center">
          <div class="p-1.5 flex items-center justify-center gap-1">
            <span>課程活動新人</span>
            <input type="text" id="stat-trainees" class="w-12 text-center font-bold text-blue-800 border-b border-slate-400 focus:outline-none" placeholder="0">
            <span>人</span>
          </div>
          <div class="p-1.5 flex items-center justify-center gap-1">
            <span>面談量</span>
            <input type="text" id="stat-interviews" class="w-12 text-center font-bold text-blue-800 border-b border-slate-400 focus:outline-none" placeholder="0">
            <span>次</span>
          </div>
          <div class="p-1.5 flex items-center justify-center gap-1">
            <span>報聘量</span>
            <input type="text" id="stat-recruits" class="w-12 text-center font-bold text-blue-800 border-b border-slate-400 focus:outline-none" placeholder="0">
            <span>人</span>
          </div>
        </div>
      </div>

      <!-- 四大自由記錄欄位 -->
      <div class="mt-4 space-y-3">
        <!-- 建議書量紀錄 -->
        <div class="border border-slate-700 rounded-sm">
          <div class="bg-slate-50 border-b border-slate-700 text-center py-0.5 text-xs font-bold tracking-widest">本 週 建 議 書 量 紀 錄</div>
          <div class="p-1 space-y-1">
            <input type="text" id="notes-prop-0" class="w-full text-xs print-line-row border-b border-slate-200 px-1.5 py-0.5 focus:outline-none focus:border-blue-400">
            <input type="text" id="notes-prop-1" class="w-full text-xs print-line-row border-b border-slate-200 px-1.5 py-0.5 focus:outline-none focus:border-blue-400">
          </div>
        </div>

        <!-- 本週開發紀錄 -->
        <div class="border border-slate-700 rounded-sm">
          <div class="bg-slate-50 border-b border-slate-700 text-center py-0.5 text-xs font-bold tracking-widest">本 週 開 發 紀 錄</div>
          <div class="p-1 space-y-1">
            <input type="text" id="notes-dev-0" class="w-full text-xs print-line-row border-b border-slate-200 px-1.5 py-0.5 focus:outline-none focus:border-blue-400">
            <input type="text" id="notes-dev-1" class="w-full text-xs print-line-row border-b border-slate-200 px-1.5 py-0.5 focus:outline-none focus:border-blue-400">
          </div>
        </div>

        <!-- 課程活動約訪名單 -->
        <div class="border border-slate-700 rounded-sm">
          <div class="bg-slate-50 border-b border-slate-700 text-center py-0.5 text-xs font-bold tracking-widest">課 程 活 動 約 訪 名 單</div>
          <div class="p-1 space-y-1">
            <input type="text" id="notes-event-0" class="w-full text-xs print-line-row border-b border-slate-200 px-1.5 py-0.5 focus:outline-none focus:border-blue-400">
            <input type="text" id="notes-event-1" class="w-full text-xs print-line-row border-b border-slate-200 px-1.5 py-0.5 focus:outline-none focus:border-blue-400">
          </div>
        </div>

        <!-- 本週重要待辦事項 -->
        <div class="border border-slate-700 rounded-sm">
          <div class="bg-slate-50 border-b border-slate-700 text-center py-0.5 text-xs font-bold tracking-widest">本 週 重 要 待 辦 事 項</div>
          <div class="p-1 space-y-1">
            <input type="text" id="notes-todo-0" class="w-full text-xs print-line-row border-b border-slate-200 px-1.5 py-0.5 focus:outline-none focus:border-blue-400">
            <input type="text" id="notes-todo-1" class="w-full text-xs print-line-row border-b border-slate-200 px-1.5 py-0.5 focus:outline-none focus:border-blue-400">
          </div>
        </div>
      </div>

    </div>
  </main>

  <script>
    // ==========================================
    // 1. Firebase 金鑰設定區
    // ==========================================
    const firebaseConfig = {
  	apiKey: "AIzaSyAHX8iMmUQhf699jC3nk4BOl8dvy1CQCL0",
  	authDomain: "weekly-control.firebaseapp.com",
  	projectId: "weekly-control",
  	storageBucket: "weekly-control.firebasestorage.app",
  	messagingSenderId: "67075158059",
  	appId: "1:67075158059:web:b21942581c02ab3444fa6e"
    };

    let db = null;
    try {
      if (firebaseConfig.apiKey !== "YOUR_API_KEY") {
        firebase.initializeApp(firebaseConfig);
        db = firebase.firestore();
      }
    } catch (e) {
      console.warn("Firebase 未設定或連線失敗，自動降級為本機模式", e);
    }

    // ==========================================
    // 2. 項目與常數定義
    // ==========================================
    const ITEMS = [
      { id: 0, title: "接觸/約訪/開發<br>保服/理賠/帶人", weight: 1 },
      { id: 1, title: "取得行程/會談機會", weight: 2 },
      { id: 2, title: "咨詢服務/搜集資料", weight: 3 },
      { id: 3, title: "建議書/面談量", weight: 3 },
      { id: 4, title: "簽要保書/新人考試", weight: 4 },
      { id: 5, title: "M受理/新人報聘", weight: 5 }
    ];
    const DAYS = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];

    // 取得當前年份與 ISO 週數（如 2026-W42）
    function getWeekId() {
      const d = new Date();
      d.setHours(0,0,0,0);
      d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7);
      const week1 = new Date(d.getFullYear(), 0, 4);
      const weekNo = 1 + Math.round(((d.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
      return `${d.getFullYear()}-W${String(weekNo).padStart(2, '0')}`;
    }

    const currentWeekId = getWeekId();
    document.getElementById('week-display').textContent = currentWeekId;

    // 取得當前成員代號
    let currentMember = localStorage.getItem('score_tracker_member') || 'member1';
    document.getElementById('member-id-input').value = currentMember;

    let activeDayIndex = (new Date().getDay() + 6) % 7; // 預設聚焦今天
    let formData = {
      t: Array.from({length: 6}, () => Array(7).fill("")),
      dateStart: "",
      dateEnd: "",
      stats: {},
      notes: {}
    };

    let debounceTimer = null;

    // ==========================================
    // 3. 畫面生成（大表 & 手機卡片）
    // ==========================================
    function initUI() {
      // 生成桌面大表格
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = ITEMS.map((item, rowIdx) => `
        <tr class="print-row-h hover:bg-slate-50/50">
          <td class="p-1 text-left font-medium leading-tight">${item.title}</td>
          <td class="font-bold text-slate-600 bg-slate-50/80">${item.weight}</td>
          ${DAYS.map((_, dayIdx) => `
            <td class="p-0 border border-slate-700">
              <input type="number" min="0" data-row="${rowIdx}" data-day="${dayIdx}" class="input-t w-full h-full text-center py-1 font-semibold focus:bg-blue-50 focus:outline-none" placeholder="·">
            </td>
            <td class="p-0 border border-slate-700 bg-slate-50/40 text-blue-700 font-bold" id="cell-p-${rowIdx}-${dayIdx}">-</td>
          `).join('')}
          <td class="font-extrabold text-slate-800 bg-slate-100" id="row-sum-${rowIdx}">0</td>
        </tr>
      `).join('');

      // 生成手機 Tabs
      const tabsContainer = document.getElementById('day-tabs');
      tabsContainer.innerHTML = DAYS.map((day, idx) => `
        <button class="day-tab-btn flex-1 py-1.5 px-2 text-xs font-bold rounded-lg border transition whitespace-nowrap ${idx === activeDayIndex ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200'}" data-day="${idx}">
          ${day}
        </button>
      `).join('');

      renderMobileCards();
      bindEvents();
    }

    function renderMobileCards() {
      const wrapper = document.getElementById('day-cards-wrapper');
      wrapper.innerHTML = ITEMS.map((item, rowIdx) => {
        const val = formData.t[rowIdx][activeDayIndex] || 0;
        const pVal = val * item.weight;
        return `
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 shadow-sm flex items-center justify-between gap-2">
            <div class="flex-1">
              <div class="text-xs font-bold text-slate-800 leading-snug">${item.title.replace('<br>', ' ')}</div>
              <div class="text-[11px] text-slate-500 mt-0.5">每件 ${item.weight} 分 ➔ 得 <span class="font-bold text-blue-600 text-xs" id="mobile-p-${rowIdx}">${pVal}</span> 分</div>
            </div>
            <div class="flex items-center gap-1">
              <button class="btn-step w-8 h-8 rounded bg-white border border-slate-300 font-bold text-slate-600 active:bg-slate-200 flex items-center justify-center text-base" data-row="${rowIdx}" data-delta="-1">-</button>
              <input type="number" min="0" value="${val || ''}" data-row="${rowIdx}" class="input-t-mobile w-12 h-8 text-center font-bold text-base bg-white border border-slate-300 rounded focus:border-blue-500 focus:outline-none" placeholder="0">
              <button class="btn-step w-8 h-8 rounded bg-blue-600 text-white font-bold active:bg-blue-700 flex items-center justify-center text-base" data-row="${rowIdx}" data-delta="1">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // ==========================================
    // 4. 計算核心
    // ==========================================
    function calculate() {
      let daySums = Array(7).fill(0);
      let grandTotal = 0;

      ITEMS.forEach((item, rowIdx) => {
        let rowSum = 0;
        for (let d = 0; d < 7; d++) {
          const tVal = parseFloat(formData.t[rowIdx][d]) || 0;
          const pVal = tVal * item.weight;
          
          const pCell = document.getElementById(`cell-p-${rowIdx}-${d}`);
          if (pCell) pCell.textContent = tVal > 0 ? pVal : '-';

          const mobileP = document.getElementById(`mobile-p-${rowIdx}`);
          if (mobileP && d === activeDayIndex) mobileP.textContent = pVal;

          rowSum += pVal;
          daySums[d] += pVal;
        }
        const rowSumElem = document.getElementById(`row-sum-${rowIdx}`);
        if (rowSumElem) rowSumElem.textContent = rowSum;
        grandTotal += rowSum;
      });

      for (let d = 0; d < 7; d++) {
        const colSumElem = document.getElementById(`col-p-sum-${d}`);
        if (colSumElem) colSumElem.textContent = daySums[d];
      }

      document.getElementById('grand-total').textContent = grandTotal;
    }

    // ==========================================
    // 5. 雲端同步與自動儲存
    // ==========================================
    function setSyncStatus(text, colorClass) {
      const status = document.getElementById('sync-status');
      const badge = document.getElementById('sync-badge');
      if (status) status.textContent = text;
    }

    async function saveToCloud() {
      setSyncStatus('同步中...', 'text-amber-500');

      // 備份到本地 localStorage
      localStorage.setItem(`20_100_${currentMember}_${currentWeekId}`, JSON.stringify(formData));

      if (db) {
        try {
          const docRef = db.collection("weekly_reports").doc(`${currentMember}_${currentWeekId}`);
          await docRef.set({
            member: currentMember,
            week: currentWeekId,
            data: formData,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setSyncStatus('已同步雲端', 'text-emerald-600');
        } catch (err) {
          console.error("雲端存檔失敗:", err);
          setSyncStatus('本機儲存 (離線)', 'text-slate-500');
        }
      } else {
        setSyncStatus('本機儲存 (未連雲端)', 'text-slate-500');
      }
    }

    function triggerAutoSave() {
      clearTimeout(debounceTimer);
      setSyncStatus('編輯中...', 'text-blue-500');
      debounceTimer = setTimeout(saveToCloud, 1000); // 防手震 1 秒
    }

    async function loadData() {
      setSyncStatus('載入中...', 'text-blue-500');
      let loaded = false;

      if (db) {
        try {
          const docRef = db.collection("weekly_reports").doc(`${currentMember}_${currentWeekId}`);
          const doc = await docRef.get();
          if (doc.exists) {
            formData = doc.data().data;
            loaded = true;
            setSyncStatus('已同步雲端', 'text-emerald-600');
          }
        } catch (e) {
          console.warn("無法自雲端讀取，改讀本地端備份", e);
        }
      }

      if (!loaded) {
        const local = localStorage.getItem(`20_100_${currentMember}_${currentWeekId}`);
        if (local) {
          formData = JSON.parse(local);
          setSyncStatus('讀取本機紀錄', 'text-slate-600');
        } else {
          // 全新空白
          formData = {
            t: Array.from({length: 6}, () => Array(7).fill("")),
            dateStart: "", dateEnd: "", stats: {}, notes: {}
          };
          setSyncStatus('本週全新表單', 'text-slate-600');
        }
      }

      // 填回表單
      document.querySelectorAll('.input-t').forEach(input => {
        const r = input.dataset.row;
        const d = input.dataset.day;
        input.value = formData.t[r][d] || "";
      });
      document.getElementById('date-start').value = formData.dateStart || "";
      document.getElementById('date-end').value = formData.dateEnd || "";

      ['leads', 'proposals', 'closes', 'trainees', 'interviews', 'recruits'].forEach(id => {
        document.getElementById(`stat-${id}`).value = (formData.stats && formData.stats[id]) || "";
      });

      for (let i = 0; i < 2; i++) {
        ['prop', 'dev', 'event', 'todo'].forEach(sec => {
          document.getElementById(`notes-${sec}-${i}`).value = (formData.notes && formData.notes[`${sec}-${i}`]) || "";
        });
      }

      renderMobileCards();
      calculate();
    }

    // ==========================================
    // 6. 事件綁定
    // ==========================================
    function bindEvents() {
      // 桌面大表 T 輸入
      document.getElementById('table-body').addEventListener('input', (e) => {
        if (e.target.classList.contains('input-t')) {
          const r = e.target.dataset.row;
          const d = e.target.dataset.day;
          formData.t[r][d] = e.target.value;
          calculate();
          triggerAutoSave();
        }
      });

      // 手機卡片點擊與輸入
      document.getElementById('day-cards-wrapper').addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-step');
        if (btn) {
          const r = btn.dataset.row;
          const delta = parseInt(btn.dataset.delta);
          let current = parseInt(formData.t[r][activeDayIndex]) || 0;
          current = Math.max(0, current + delta);
          formData.t[r][activeDayIndex] = current > 0 ? current : "";
          
          // 連動大表與卡片
          const inputDesk = document.querySelector(`.input-t[data-row="${r}"][data-day="${activeDayIndex}"]`);
          if (inputDesk) inputDesk.value = formData.t[r][activeDayIndex];
          const inputMob = document.querySelector(`.input-t-mobile[data-row="${r}"]`);
          if (inputMob) inputMob.value = formData.t[r][activeDayIndex];

          calculate();
          triggerAutoSave();
        }
      });

      document.getElementById('day-cards-wrapper').addEventListener('input', (e) => {
        if (e.target.classList.contains('input-t-mobile')) {
          const r = e.target.dataset.row;
          formData.t[r][activeDayIndex] = e.target.value;
          const inputDesk = document.querySelector(`.input-t[data-row="${r}"][data-day="${activeDayIndex}"]`);
          if (inputDesk) inputDesk.value = e.target.value;
          calculate();
          triggerAutoSave();
        }
      });

      // 手機切換星期 Tabs
      document.getElementById('day-tabs').addEventListener('click', (e) => {
        const btn = e.target.closest('.day-tab-btn');
        if (btn) {
          activeDayIndex = parseInt(btn.dataset.day);
          document.querySelectorAll('.day-tab-btn').forEach((b, i) => {
            if (i === activeDayIndex) {
              b.className = 'day-tab-btn flex-1 py-1.5 px-2 text-xs font-bold rounded-lg border transition whitespace-nowrap bg-blue-600 text-white border-blue-600';
            } else {
              b.className = 'day-tab-btn flex-1 py-1.5 px-2 text-xs font-bold rounded-lg border transition whitespace-nowrap bg-white text-slate-600 border-slate-200';
            }
          });
          renderMobileCards();
        }
      });

      // 切換成員
      document.getElementById('btn-switch-member').addEventListener('click', () => {
        const val = document.getElementById('member-id-input').value.trim();
        if (val) {
          currentMember = val;
          localStorage.setItem('score_tracker_member', currentMember);
          loadData();
        }
      });

      // 手機視角切換 (卡片 / 大表)
      document.getElementById('btn-toggle-view').addEventListener('click', () => {
        const focusSec = document.getElementById('mobile-focus-section');
        const deskTable = document.getElementById('desktop-table-wrapper');
        const txt = document.getElementById('toggle-view-text');
        if (focusSec.classList.contains('hidden')) {
          focusSec.classList.remove('hidden');
          deskTable.classList.add('hidden');
          txt.textContent = '📊 全週大表';
        } else {
          focusSec.classList.add('hidden');
          deskTable.classList.remove('hidden');
          txt.textContent = '📱 每日卡片';
        }
      });

      // 其餘欄位輸入儲存
      ['date-start', 'date-end'].forEach(id => {
        document.getElementById(id).addEventListener('input', (e) => {
          if (id === 'date-start') formData.dateStart = e.target.value;
          if (id === 'date-end') formData.dateEnd = e.target.value;
          triggerAutoSave();
        });
      });

      ['leads', 'proposals', 'closes', 'trainees', 'interviews', 'recruits'].forEach(id => {
        document.getElementById(`stat-${id}`).addEventListener('input', (e) => {
          formData.stats[id] = e.target.value;
          triggerAutoSave();
        });
      });

      for (let i = 0; i < 2; i++) {
        ['prop', 'dev', 'event', 'todo'].forEach(sec => {
          document.getElementById(`notes-${sec}-${i}`).addEventListener('input', (e) => {
            formData.notes[`${sec}-${i}`] = e.target.value;
            triggerAutoSave();
          });
        });
      }

      // 列印與一鍵清零
      document.getElementById('btn-print').addEventListener('click', () => window.print());
      document.getElementById('btn-clear').addEventListener('click', () => {
        if (confirm(`確定要清空成員【${currentMember}】本週 (${currentWeekId}) 的所有紀錄嗎？`)) {
          formData = {
            t: Array.from({length: 6}, () => Array(7).fill("")),
            dateStart: "", dateEnd: "", stats: {}, notes: {}
          };
          saveToCloud();
          loadData();
        }
      });
    }

    // 啟動
    initUI();
    loadData();
  </script>
</body>
</html>
