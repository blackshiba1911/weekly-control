<script>
    // 1. Firebase 雲端初始化
    const fbConfig = {
      apiKey: "AIzaSyAHX8iMmUQhf699jC3nk4BOl8dvy1CQCL0",
      authDomain: "weekly-control.firebaseapp.com",
      projectId: "weekly-control",
      storageBucket: "weekly-control.firebasestorage.app",
      messagingSenderId: "67075158059",
      appId: "1:67075158059:web:b21942581c02ab3444fa6e"
    };

    let cloudDb = null;
    try {
      if (typeof firebase !== 'undefined') {
        firebase.initializeApp(fbConfig);
        cloudDb = firebase.firestore();
      }
    } catch (err) {
      console.warn("雲端模組載入異常，改用本機快取:", err);
    }

    // 2. 項目與週次定義
    const SCORE_ITEMS = [
      { id: 0, text: "接觸/約訪/開發<br>保服/理賠/帶人", weight: 1 },
      { id: 1, text: "取得行程/會談機會", weight: 2 },
      { id: 2, text: "咨詢服務/搜集資料", weight: 3 },
      { id: 3, text: "建議書/面談量", weight: 3 },
      { id: 4, text: "簽要保書/新人考試", weight: 4 },
      { id: 5, text: "M受理/新人報聘", weight: 5 }
    ];
    const WEEK_DAYS = ['週一', '週二', '週三', '週四', '週五', '週六', '週日'];

    // 取得指定年份共有幾週 (ISO 8601 標準下通常為 52 週，少數年份為 53 週)
    function getWeeksInISOYear(year) {
      const p = (year + Math.floor(year / 4) - Math.floor(year / 100) + Math.floor(year / 400)) % 7;
      const lastYearP = ((year - 1) + Math.floor((year - 1) / 4) - Math.floor((year - 1) / 100) + Math.floor((year - 1) / 400)) % 7;
      return (p === 4 || lastYearP === 3) ? 53 : 52;
    }

    // 計算指定年與週次週一的日期 (用於在選單旁顯示日期範圍，例如: 10/12~10/18)
    function getWeekRangeText(year, week) {
      const simple = new Date(year, 0, 1 + (week - 1) * 7);
      const dow = simple.getDay();
      const isoMon = new Date(simple);
      if (dow <= 4) {
        isoMon.setDate(simple.getDate() - simple.getDay() + 1);
      } else {
        isoMon.setDate(simple.getDate() + 8 - simple.getDay());
      }
      const isoSun = new Date(isoMon);
      isoSun.setDate(isoMon.getDate() + 6);

      const formatMDate = (d) => `${d.getMonth() + 1}/${d.getDate()}`;
      return `${formatMDate(isoMon)} ~ ${formatMDate(isoSun)}`;
    }

    // 當前實際年與週
    const nowTime = new Date();
    const currentRealWeekStr = getISOWeekString(nowTime); // 例如: 2026-W42
    const currentYear = parseInt(currentRealWeekStr.split('-W')[0], 10);
    const currentWeekNum = parseInt(currentRealWeekStr.split('-W')[1], 10);

    let selectedYear = currentYear;
    let selectedWeekNum = currentWeekNum;
    let targetWeek = currentRealWeekStr; // 組合出 2026-W42

    // 初始化年份與週次選單
    function setupWeekDropdown() {
      const yearSelect = document.getElementById('year-select');
      const weekSelect = document.getElementById('week-select');
      if (!yearSelect || !weekSelect) return;

      // 1. 生成年份選項 (前後支援：建置年份 2025、當前年份、未來 1 年)
      yearSelect.innerHTML = '';
      const startYear = 2025; // 系統起始年份
      const endYear = currentYear + 1; // 支援到隔年
      for (let y = endYear; y >= startYear; y--) {
        const opt = document.createElement('option');
        opt.value = y;
        opt.textContent = `${y} 年`;
        if (y === selectedYear) opt.selected = true;
        yearSelect.appendChild(opt);
      }

      // 2. 根據年份生成對應的所有週次 (1 ~ 52 或 53 週)
      function populateWeeks(year) {
        weekSelect.innerHTML = '';
        const totalWeeks = getWeeksInISOYear(year);

        for (let w = 1; w <= totalWeeks; w++) {
          const wStr = String(w).padStart(2, '0');
          const fullWeekId = `${year}-W${wStr}`;
          const dateRange = getWeekRangeText(year, w);

          const opt = document.createElement('option');
          opt.value = fullWeekId;

          // 標註「本週」供快速識別
          if (fullWeekId === currentRealWeekStr) {
            opt.textContent = `W${wStr} (${dateRange}) [本週]`;
            opt.selected = true;
          } else {
            opt.textContent = `W${wStr} (${dateRange})`;
            if (w === selectedWeekNum && year === selectedYear) {
              opt.selected = true;
            }
          }
          weekSelect.appendChild(opt);
        }
      }

      populateWeeks(selectedYear);
      updateDisplayAndData();

      // 年份切換事件
      yearSelect.addEventListener('change', (e) => {
        selectedYear = parseInt(e.target.value, 10);
        // 若切換到當前年份，自動回到當週，其他年份則預設第 1 週
        selectedWeekNum = (selectedYear === currentYear) ? currentWeekNum : 1;
        populateWeeks(selectedYear);
        updateDisplayAndData();
      });

      // 週次切換事件
      weekSelect.addEventListener('change', (e) => {
        targetWeek = e.target.value;
        selectedWeekNum = parseInt(targetWeek.split('-W')[1], 10);
        updateDisplayAndData();
      });

      function updateDisplayAndData() {
        targetWeek = weekSelect.value;
        const displayElem = document.getElementById('week-display');
        if (displayElem) displayElem.textContent = targetWeek;
        // 切換後自動重新從雲端/本地載入該週資料
        if (activeMember) {
          retrieveData();
        }
      }
    }

    // 預設為空白，讓使用者自行輸入
    let activeMember = localStorage.getItem('score_tracker_member') || '';
    document.getElementById('member-id-input').value = activeMember;

    let selectedDay = (new Date().getDay() + 6) % 7;
    let reportState = {
      t: Array.from({ length: 6 }, () => Array(7).fill("")),
      dateStart: "",
      dateEnd: "",
      stats: {},
      notes: {}
    };

    let syncTimer = null;

    // 3. 畫面元素渲染
    function setupInterface() {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = SCORE_ITEMS.map((item, rIdx) => `
        <tr class="print-row-h hover:bg-slate-50/50">
          <td class="p-1 text-left font-medium leading-tight">${item.text}</td>
          <td class="font-bold text-slate-600 bg-slate-50/80">${item.weight}</td>
          ${WEEK_DAYS.map((_, dIdx) => `
            <td class="p-0 border border-slate-700">
              <input type="number" min="0" data-row="${rIdx}" data-day="${dIdx}" class="input-t w-full h-full text-center py-1 font-semibold focus:bg-blue-50 focus:outline-none" placeholder="·">
            </td>
            <td class="p-0 border border-slate-700 bg-slate-50/40 text-blue-700 font-bold" id="cell-p-${rIdx}-${dIdx}">-</td>
          `).join('')}
          <td class="font-extrabold text-slate-800 bg-slate-100" id="row-sum-${rIdx}">0</td>
        </tr>
      `).join('');

      const tabsBox = document.getElementById('day-tabs');
      tabsBox.innerHTML = WEEK_DAYS.map((dName, idx) => `
        <button type="button" class="day-tab-btn flex-1 py-1.5 px-2 text-xs font-bold rounded-lg border transition whitespace-nowrap ${idx === selectedDay ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-slate-600 border-slate-200'}" data-day="${idx}">
          ${dName}
        </button>
      `).join('');

      renderDayCards();
      attachListeners();
    }

    function renderDayCards() {
      const cardBox = document.getElementById('day-cards-wrapper');
      cardBox.innerHTML = SCORE_ITEMS.map((item, rIdx) => {
        const qty = parseFloat(reportState.t[rIdx][selectedDay]) || 0;
        const pts = qty * item.weight;
        return `
          <div class="bg-slate-50 p-3 rounded-lg border border-slate-200 shadow-sm flex items-center justify-between gap-2">
            <div class="flex-1">
              <div class="text-xs font-bold text-slate-800 leading-snug">${item.text.replace('<br>', ' ')}</div>
              <div class="text-[11px] text-slate-500 mt-0.5">每件 ${item.weight} 分 ➔ 得 <span class="font-bold text-blue-600 text-xs" id="mobile-p-${rIdx}">${pts}</span> 分</div>
            </div>
            <div class="flex items-center gap-1">
              <button type="button" class="btn-step w-9 h-9 rounded bg-white border border-slate-300 font-bold text-slate-600 active:bg-slate-200 flex items-center justify-center text-lg select-none" data-row="${rIdx}" data-delta="-1">-</button>
              <input type="number" min="0" value="${qty || ''}" data-row="${rIdx}" class="input-t-mobile w-12 h-9 text-center font-bold text-base bg-white border border-slate-300 rounded focus:border-blue-500 focus:outline-none" placeholder="0">
              <button type="button" class="btn-step w-9 h-9 rounded bg-blue-600 text-white font-bold active:bg-blue-700 flex items-center justify-center text-lg select-none" data-row="${rIdx}" data-delta="1">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    // 4. 計算加總
    function recalculateScores() {
      let dailyTotals = Array(7).fill(0);
      let weeklyTotal = 0;

      SCORE_ITEMS.forEach((item, rIdx) => {
        let rTotal = 0;
        for (let d = 0; d < 7; d++) {
          const val = parseFloat(reportState.t[rIdx][d]) || 0;
          const score = val * item.weight;

          const pBox = document.getElementById(`cell-p-${rIdx}-${d}`);
          if (pBox) pBox.textContent = val > 0 ? score : '-';

          const mobP = document.getElementById(`mobile-p-${rIdx}`);
          if (mobP && d === selectedDay) mobP.textContent = score;

          rTotal += score;
          dailyTotals[d] += score;
        }
        const rSumElem = document.getElementById(`row-sum-${rIdx}`);
        if (rSumElem) rSumElem.textContent = rTotal;
        weeklyTotal += rTotal;
      });

      for (let d = 0; d < 7; d++) {
        const dSumElem = document.getElementById(`col-p-sum-${d}`);
        if (dSumElem) dSumElem.textContent = dailyTotals[d];
      }

      document.getElementById('grand-total').textContent = weeklyTotal;
    }

    // 5. 雲端讀寫處理（已包含二維陣列修復邏輯）
    function updateSyncIndicator(msg) {
      const elem = document.getElementById('sync-status');
      if (elem) elem.textContent = msg;
    }

// 項目簡稱與星期名稱定義（用於 Firestore 易讀標籤）
    const ITEM_KEYS = [
      "接觸約訪",
      "會談機會",
      "咨詢資料",
      "建議書面談",
      "簽要保書",
      "受理報聘"
    ];

    // 壓平轉為易讀中文物件
    function serializeGrid(arr) {
      let obj = {};
      for (let r = 0; r < 6; r++) {
        for (let d = 0; d < 7; d++) {
          const key = `${ITEM_KEYS[r]}_${WEEK_DAYS[d]}`;
          obj[key] = (arr && arr[r] && arr[r][d]) || "";
        }
      }
      return obj;
    }

    // 將易讀中文物件還原回 6x7 矩陣（相容舊版 r0_d0 格式）
    function deserializeGrid(obj) {
      let arr = Array.from({ length: 6 }, () => Array(7).fill(""));
      if (!obj) return arr;
      for (let r = 0; r < 6; r++) {
        for (let d = 0; d < 7; d++) {
          const newKey = `${ITEM_KEYS[r]}_${WEEK_DAYS[d]}`;
          const oldKey = `r${r}_d${d}`;
          // 優先讀取中文 Key，若無則讀取舊版相容 Key
          arr[r][d] = obj[newKey] !== undefined ? obj[newKey] : (obj[oldKey] || "");
        }
      }
      return arr;
    }

    async function syncToDatabase() {
      if (!activeMember) {
        updateSyncIndicator('請輸入姓名');
        return;
      }
      updateSyncIndicator('同步中...');
      const localKey = `20_100_${activeMember}_${targetWeek}`;
      localStorage.setItem(localKey, JSON.stringify(reportState));

      if (cloudDb) {
        try {
          const docId = `${activeMember}_${targetWeek}`;
          const payload = {
            t_flat: serializeGrid(reportState.t),
            dateStart: reportState.dateStart || "",
            dateEnd: reportState.dateEnd || "",
            stats: reportState.stats || {},
            notes: reportState.notes || {}
          };

          await cloudDb.collection("weekly_reports").doc(docId).set({
            member: activeMember,
            week: targetWeek,
            data: payload,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          updateSyncIndicator('已同步雲端');
        } catch (e) {
          console.error("寫入雲端失敗:", e);
          updateSyncIndicator('本機儲存 (離線)');
        }
      } else {
        updateSyncIndicator('本機儲存');
      }
    }

    function queueSync() {
      clearTimeout(syncTimer);
      updateSyncIndicator('編輯中...');
      syncTimer = setTimeout(syncToDatabase, 800);
    }

    async function retrieveData() {
      if (!activeMember) {
        updateSyncIndicator('未指定成員');
        return;
      }
      updateSyncIndicator('載入中...');
      let isFetched = false;

      if (cloudDb) {
        try {
          const docId = `${activeMember}_${targetWeek}`;
          const snapshot = await cloudDb.collection("weekly_reports").doc(docId).get();
          if (snapshot.exists) {
            const rawData = snapshot.data().data;
            reportState = {
              t: deserializeGrid(rawData.t_flat),
              dateStart: rawData.dateStart || "",
              dateEnd: rawData.dateEnd || "",
              stats: rawData.stats || {},
              notes: rawData.notes || {}
            };
            isFetched = true;
            updateSyncIndicator('已同步雲端');
          }
        } catch (err) {
          console.warn("無法取得遠端資料:", err);
        }
      }

      if (!isFetched) {
        const cached = localStorage.getItem(`20_100_${activeMember}_${targetWeek}`);
        if (cached) {
          reportState = JSON.parse(cached);
          updateSyncIndicator('讀取本機紀錄');
        } else {
          reportState = {
            t: Array.from({ length: 6 }, () => Array(7).fill("")),
            dateStart: "",
            dateEnd: "",
            stats: {},
            notes: {}
          };
          updateSyncIndicator('本週全新表單');
        }
      }

      // 填回畫面各欄位
      document.querySelectorAll('.input-t').forEach(el => {
        const r = el.dataset.row;
        const d = el.dataset.day;
        el.value = (reportState.t && reportState.t[r] && reportState.t[r][d]) || "";
      });
      document.getElementById('date-start').value = reportState.dateStart || "";
      document.getElementById('date-end').value = reportState.dateEnd || "";

      ['leads', 'proposals', 'closes', 'trainees', 'interviews', 'recruits'].forEach(k => {
        const f = document.getElementById(`stat-${k}`);
        if (f) f.value = (reportState.stats && reportState.stats[k]) || "";
      });

      for (let i = 0; i < 2; i++) {
        ['prop', 'dev', 'event', 'todo'].forEach(sec => {
          const field = document.getElementById(`notes-${sec}-${i}`);
          if (field) field.value = (reportState.notes && reportState.notes[`${sec}-${i}`]) || "";
        });
      }

      renderDayCards();
      recalculateScores();
    }

    // 6. 互動與按鍵綁定
    function attachListeners() {
      document.getElementById('table-body').addEventListener('input', (e) => {
        if (e.target.classList.contains('input-t')) {
          const r = e.target.dataset.row;
          const d = e.target.dataset.day;
          reportState.t[r][d] = e.target.value;
          recalculateScores();
          queueSync();
        }
      });

      document.getElementById('day-cards-wrapper').addEventListener('click', (e) => {
        const btn = e.target.closest('.btn-step');
        if (btn) {
          const r = btn.dataset.row;
          const delta = parseInt(btn.dataset.delta, 10);
          let val = parseInt(reportState.t[r][selectedDay], 10) || 0;
          val = Math.max(0, val + delta);
          reportState.t[r][selectedDay] = val > 0 ? val : "";

          const deskInp = document.querySelector(`.input-t[data-row="${r}"][data-day="${selectedDay}"]`);
          if (deskInp) deskInp.value = reportState.t[r][selectedDay];
          const mobInp = document.querySelector(`.input-t-mobile[data-row="${r}"]`);
          if (mobInp) mobInp.value = reportState.t[r][selectedDay];

          recalculateScores();
          queueSync();
        }
      });

      document.getElementById('day-cards-wrapper').addEventListener('input', (e) => {
        if (e.target.classList.contains('input-t-mobile')) {
          const r = e.target.dataset.row;
          reportState.t[r][selectedDay] = e.target.value;
          const deskInp = document.querySelector(`.input-t[data-row="${r}"][data-day="${selectedDay}"]`);
          if (deskInp) deskInp.value = e.target.value;
          recalculateScores();
          queueSync();
        }
      });

      document.getElementById('day-tabs').addEventListener('click', (e) => {
        const tab = e.target.closest('.day-tab-btn');
        if (tab) {
          selectedDay = parseInt(tab.dataset.day, 10);
          document.querySelectorAll('.day-tab-btn').forEach((b, i) => {
            b.className = i === selectedDay
              ? 'day-tab-btn flex-1 py-1.5 px-2 text-xs font-bold rounded-lg border transition whitespace-nowrap bg-blue-600 text-white border-blue-600'
              : 'day-tab-btn flex-1 py-1.5 px-2 text-xs font-bold rounded-lg border transition whitespace-nowrap bg-white text-slate-600 border-slate-200';
          });
          renderDayCards();
        }
      });

      const handleMemberAction = () => {
        const inputVal = document.getElementById('member-id-input').value.trim();
        if (inputVal) {
          activeMember = inputVal;
          localStorage.setItem('score_tracker_member', activeMember);
          document.getElementById('member-id-input').blur();
          retrieveData();
        }
      };

      document.getElementById('btn-switch-member').addEventListener('click', handleMemberAction);
      document.getElementById('member-id-input').addEventListener('keydown', (e) => {
        if (e.key === 'Enter') handleMemberAction();
      });

      document.getElementById('btn-toggle-view').addEventListener('click', () => {
        const focusCard = document.getElementById('mobile-focus-section');
        const matrixTable = document.getElementById('desktop-table-wrapper');
        const viewText = document.getElementById('toggle-view-text');
        if (focusCard.classList.contains('hidden')) {
          focusCard.classList.remove('hidden');
          matrixTable.classList.add('hidden');
          viewText.textContent = '📊 全週大表';
        } else {
          focusCard.classList.add('hidden');
          matrixTable.classList.remove('hidden');
          viewText.textContent = '📱 每日卡片';
        }
      });

      ['date-start', 'date-end'].forEach(id => {
        document.getElementById(id).addEventListener('input', (e) => {
          if (id === 'date-start') reportState.dateStart = e.target.value;
          if (id === 'date-end') reportState.dateEnd = e.target.value;
          queueSync();
        });
      });

      ['leads', 'proposals', 'closes', 'trainees', 'interviews', 'recruits'].forEach(k => {
        document.getElementById(`stat-${k}`).addEventListener('input', (e) => {
          reportState.stats[k] = e.target.value;
          queueSync();
        });
      });

      for (let i = 0; i < 2; i++) {
        ['prop', 'dev', 'event', 'todo'].forEach(sec => {
          document.getElementById(`notes-${sec}-${i}`).addEventListener('input', (e) => {
            reportState.notes[`${sec}-${i}`] = e.target.value;
            queueSync();
          });
        });
      }

      document.getElementById('btn-clear').addEventListener('click', () => {
        if (confirm(`確定要清空【${activeMember || '當前紀錄'}】本週的所有輸入數據嗎？`)) {
          reportState = {
            t: Array.from({ length: 6 }, () => Array(7).fill("")),
            dateStart: "",
            dateEnd: "",
            stats: {},
            notes: {}
          };
          syncToDatabase();
          retrieveData();
        }
      });
    }

    // 啟動入口
setupWeekDropdown(); // 👈 確保最先載入生成週次選項
setupInterface();
if (activeMember) {
  retrieveData();
}
  </script>
</body>
</html>
